name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: psl1ght/psl1ght:latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Compilar PKG
        run: |
          make pkg

      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: pou-ps3-pkg
          path: "*.pkg"
